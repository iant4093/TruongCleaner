name: CI and app release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Workflow and secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: actionlint, shellcheck, zizmor and Gitleaks
        run: bash scripts/check-workflows.sh
      - name: Initialize workflow CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: actions
          build-mode: none
      - name: CodeQL workflow analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:actions

  logic:
    name: SwiftLint, safety checks and package tests
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: SwiftLint
        run: bash scripts/lint.sh
      - name: Deletion call sites stay inside CleanerActions
        run: |
          bash scripts/check-deletion-sites.sh --self-test
          bash scripts/check-deletion-sites.sh
      - name: CleanerKit tests (Swift Testing)
        env:
          # 3-core shared runner: widen promptness checks (see Tests/Fixtures/TimingBudget.swift).
          TC_TIMING_SLACK: "10"
          TC_TEST_PARALLEL: "0"
        run: bash scripts/test.sh package
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-test-logs
          path: build/logs/
          if-no-files-found: ignore
          retention-days: 7

  app:
    name: App build, analysis and packaging
    runs-on: xcode-27
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify Xcode and SDK
        run: |
          xcodebuild -version
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK $sdk"
          test "${sdk%%.*}" -ge 27
          printf 'TRUONGCLEANER_BUILD_NUMBER=%s\n' "$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Debug and Release builds
        run: bash scripts/build.sh all
      - name: Xcode static analysis
        run: |
          mkdir -p build/logs
          xcodebuild -project TruongCleaner.xcodeproj -scheme TruongCleaner \
            -configuration Debug -destination 'generic/platform=macOS' \
            -derivedDataPath build/AnalysisDerivedData CODE_SIGNING_ALLOWED=NO \
            analyze > build/logs/analyze.log 2>&1 || { tail -60 build/logs/analyze.log; exit 1; }
          # Source warnings only; tool notices such as appintentsmetadataprocessor are not code.
          if grep -Eq '\.swift:[0-9]+:[0-9]+: warning:' build/logs/analyze.log; then
            grep -E '\.swift:[0-9]+:[0-9]+: warning:' build/logs/analyze.log | sort -u | head -40
            exit 1
          fi
      - name: Sign, verify and package
        run: |
          bash scripts/package.sh
          app=build/ReleaseDerivedData/Build/Products/Release/TruongCleaner.app
          mkdir -p build/release-meta
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist" > build/release-meta/VERSION
          cp docs/RELEASE_NOTES.md build/release-meta/RELEASE_NOTES.md
      - name: Upload release notes and version
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-meta
          path: build/release-meta/
          if-no-files-found: error
          retention-days: 14
      - name: Upload release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-build-logs
          path: build/logs/
          if-no-files-found: ignore
          retention-days: 7

  attest:
    name: Build provenance
    needs: [app]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that can mint an OIDC token; it runs no repository scripts.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: dist
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  release:
    name: Publish latest build
    # Build numbers are 1000 + this workflow's run number: never rename ci.yml.
    needs: [quality, logic, app, attest]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-meta
          path: meta
      - name: Publish verified build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          head_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            echo 'A newer commit is on main; its successful build will publish instead.'
            exit 0
          fi
          # The tag stays build-N: the in-app updater reads the build number from it.
          tag="build-$GITHUB_RUN_NUMBER"
          build="$((1000 + GITHUB_RUN_NUMBER))"
          version="$(tr -cd '0-9.' < ../meta/VERSION)"
          {
            cat ../meta/RELEASE_NOTES.md
            printf '\n\n---\nBuild %s from %s. Checksums, matching crash symbols and build provenance are attached (verify with: gh attestation verify TruongCleaner.zip --repo %s).\n' "$build" "$GITHUB_SHA" "$GH_REPO"
          } > ../notes.md
          if gh release view "$tag" --json isDraft --jq .isDraft > existing-draft 2>/dev/null; then
            if [ "$(cat existing-draft)" = false ]; then
              echo 'This run already published its release.'
              exit 0
            fi
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "TruongCleaner $version · Build $build" \
              --notes-file ../notes.md
          fi
          gh release upload "$tag" TruongCleaner.dmg TruongCleaner.zip install.sh TruongCleaner.dSYM.zip SHA256SUMS --clobber
          gh release edit "$tag" --draft=false --latest
